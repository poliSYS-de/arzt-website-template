name: Build (Template, kein Deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dieses Repo ist eine Klon-Vorlage ohne eigene Domain und wird deshalb nicht
# ausgeliefert (Ticket A-260903-template-deploy-dauerhaft-rot). Der Workflow prüft
# nur noch, dass das Template baut.
#
# Ein Klon MIT eigener Domain trägt seinen Deploy hier ein: lftp mirror mit
# --parallel=10 nach .claude/rules/astro-ftp-deploy.md (ASTRO-FTP-001), danach den
# Post-Deploy-Link-Check "node scripts/check-links.mjs". Das Script bleibt dafür im
# Repo erhalten. Referenz-Pipeline: poliSYS-de/arztbesuche-showcase.

# Nur ein Lauf dieses Repos gleichzeitig; Folge-Runs warten statt parallel zu laufen
# (T-SW-260828-deploy-concurrency-timeout). Beim Klonen dieses Templates: group-Kennung
# eindeutig auf das neue Projekt ändern - eine geerbte, identische Kennung über mehrere
# geklonte Projekte wäre schlechter als keine Gruppe.
concurrency:
  group: build-beispiel-arzt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Site
        run: npm run build
